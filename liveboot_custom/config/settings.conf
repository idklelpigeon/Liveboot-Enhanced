# Custom LiveBoot settings
# Lines beginning with # or ; are comments. Changes take effect on the next boot.

# Text file in liveboot_custom/messages/ (file name only).
message=default.txt

# false = opaque background; true = transparent background using opacity below.
transparent=false
# Background opacity when transparent=true: 0 (invisible) through 100 (opaque).
opacity=75
# Keep the final scripted screen visible this many milliseconds before shutdown (0-60000).
finish_hold_ms=1500

# Image support: [image=filename.png] in a message script; [image=none] clears the image.
# Images must be stored directly in liveboot_custom/images/ (PNG, JPG/JPEG, or WebP).
# cover fills the screen and may crop; contain shows the entire image; stretch distorts to fit.
image_fit=cover
# Image opacity: 0-100. PNG transparency is also respected.
image_opacity=100
# Default image stacking: behind (under) or front (over) scripted text.
image_layer=behind

# true = black; false = dark gray background (visible around transparent images).
# This background setting doesn't cover an image; the image is drawn over it.
dark=true

# Font file in liveboot_custom/fonts/. Use a .ttf or .otf filename; blank/monospace = built-in monospace.
font=LiveBootMono.ttf
# 0 = automatic size based on lines; otherwise text size in pixels (1-256).
text_size=0
# Used when text_size=0. Higher values show more, smaller lines.
lines=100
wordwrap=true
save=true
logcatcolors=true
