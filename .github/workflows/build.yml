name: Build LiveBoot Enhanced

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: |
          ./tests/run-parser-smoke.sh
          ./tests/run-font-smoke.sh
          ./tests/run-message-limit-smoke.sh
      - run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          chmod 0755 build_module.sh package_module.sh liveboot/gradlew
          ./build_module.sh
      - run: ./package_module.sh "$GITHUB_WORKSPACE/LiveBoot_Enhanced_v1.0.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: LiveBoot-Enhanced-v1.0
          path: |
            LiveBoot_Enhanced_v1.0.zip
            liveboot_custom/files/liveboot.apk
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LiveBoot Enhanced v1.0
          generate_release_notes: true
          files: LiveBoot_Enhanced_v1.0.zip
